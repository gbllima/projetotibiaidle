name: Finalize VIP consistency once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/vip-consistency-once.yml'

permissions:
  contents: write

jobs:
  finish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - name: Align VIP UI and admin grants
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          def rep(path, old, new, expected=1):
              p = Path(path)
              s = p.read_text(encoding='utf-8')
              n = s.count(old)
              if n != expected:
                  raise SystemExit(f'{path}: expected {expected}, found {n}: {old[:120]!r}')
              p.write_text(s.replace(old, new, expected), encoding='utf-8')

          rep(
              'apps/web/src/components/SystemsPanel.tsx',
              '''      <p>Saldo: {character.coins} TC</p>\n      <button className="btn gold" disabled={busy} onClick={() => void onAct({ type: 'shop', sku: 'vip7' })}>7 dias · 250 TC</button>\n      <button className="btn gold" style={{ marginLeft: 8 }} disabled={busy} onClick={() => void onAct({ type: 'shop', sku: 'vip30' })}>30 dias · 900 TC</button>\n      <p className="lede" style={{ textAlign: 'left', marginTop: 12 }}>Veja também a aba Store → Premium / VIP na Loja.</p>''',
              '''      <p>Saldo: {character.coins} Knock Coins</p>\n      <div className="row" style={{ gap: 8, flexWrap: 'wrap' }}>\n        <button className="btn gold" disabled={busy || character.coins < 150} onClick={() => void onAct({ type: 'shop', sku: 'vip7' })}>7 dias · 150 KC</button>\n        <button className="btn gold" disabled={busy || character.coins < 500} onClick={() => void onAct({ type: 'shop', sku: 'vip30' })}>30 dias · 500 KC</button>\n        <button className="btn gold" disabled={busy || character.coins < 1_350} onClick={() => void onAct({ type: 'shop', sku: 'vip90' })}>90 dias · 1.350 KC</button>\n        <button className="btn gold" disabled={busy || character.coins < 4_500} onClick={() => void onAct({ type: 'shop', sku: 'vip365' })}>365 dias · 4.500 KC</button>\n      </div>\n      <p className="lede" style={{ textAlign: 'left', marginTop: 12 }}>O VIP é da conta e vale para todos os personagens. Veja também Loja → Premium / VIP.</p>'''
          )

          rep(
              'apps/server/src/economy.ts',
              '''function propagateVip(db: Database, accountId: number, vipUntil: number, now: number): void {\n  db.setWorld(VIP_KEY(accountId), String(vipUntil));\n  for (const row of db.charactersForAccount(accountId)) {\n    const parsed = parseAuthoritative(row);\n    if (!parsed) continue;\n    applyVipToCharacter(parsed.state, vipUntil, now);\n    if (parsed.session) applyVipToCharacter(parsed.session.character, vipUntil, now);\n    db.saveCharacter(\n      row.id,\n      JSON.stringify(parsed.state),\n      parsed.session ? JSON.stringify(parsed.session) : null,\n      now,\n    );\n  }\n}\n''',
              '''function propagateVip(db: Database, accountId: number, vipUntil: number, now: number): void {\n  db.setWorld(VIP_KEY(accountId), String(vipUntil));\n  for (const row of db.charactersForAccount(accountId)) {\n    const parsed = parseAuthoritative(row);\n    if (!parsed) continue;\n    applyVipToCharacter(parsed.state, vipUntil, now);\n    if (parsed.session) applyVipToCharacter(parsed.session.character, vipUntil, now);\n    db.saveCharacter(\n      row.id,\n      JSON.stringify(parsed.state),\n      parsed.session ? JSON.stringify(parsed.session) : null,\n      now,\n    );\n  }\n}\n\nexport function grantAccountVipDays(\n  db: Database,\n  accountId: number,\n  vipDays: number,\n  now = Date.now(),\n): number {\n  if (!Number.isSafeInteger(vipDays) || vipDays < 1 || vipDays > 3650) {\n    throw new GameError('Valor de VIP inválido.', 422);\n  }\n  const vipUntil = Math.max(accountVipUntil(db, accountId), now) + vipDays * 86_400_000;\n  propagateVip(db, accountId, vipUntil, now);\n  return vipUntil;\n}\n'''
          )

          rep(
              'apps/server/src/admin.ts',
              "import { metricsSnapshot } from './metrics.js';\nimport { GameError } from './settle.js';",
              "import { metricsSnapshot } from './metrics.js';\nimport { grantAccountVipDays } from './economy.js';\nimport { GameError } from './settle.js';"
          )

          rep(
              'apps/server/src/admin.ts',
              '''    loaded.character.gold += gold;\n    loaded.character.coins += coins;\n    if (vipDays > 0) {\n      loaded.character.premium = true;\n      loaded.character.vipUntil = Math.max(loaded.character.vipUntil ?? 0, now) + vipDays * 86_400_000;\n    }\n    db.saveCharacter(loaded.row.id, JSON.stringify(loaded.character), loaded.session ? JSON.stringify(loaded.session) : null, now);\n    return { character: describeCharacter(loaded, db) };''',
              '''    loaded.character.gold += gold;\n    loaded.character.coins += coins;\n    db.saveCharacter(loaded.row.id, JSON.stringify(loaded.character), loaded.session ? JSON.stringify(loaded.session) : null, now);\n    if (vipDays > 0) {\n      grantAccountVipDays(db, row.accountId, vipDays, now);\n      const refreshed = loadCharacter(db, row.accountId, characterId, now).loaded;\n      return { character: describeCharacter(refreshed, db) };\n    }\n    return { character: describeCharacter(loaded, db) };'''
          )

          rep(
              'apps/server/test/admin-edge.test.ts',
              '''  it('rejects non-finite or excessive numeric admin mutations', () => {\n    const characterId = createActiveHunter();\n    expect(() => adminAct(db, adminId, { type: 'grant', characterId, gold: Infinity }, NOW)).toThrow('Valor numérico inválido');\n    expect(() => adminAct(db, adminId, { type: 'code', code: 'BAD-NUM', coins: Infinity }, NOW)).toThrow('Valor numérico inválido');\n    expect(() => adminAct(db, adminId, { type: 'mute', accountId: playerId, minutes: 999_999_999 }, NOW)).toThrow('Valor numérico inválido');\n  });''',
              '''  it('grants VIP to the whole account, including active hunt sessions', () => {\n    const firstId = createActiveHunter();\n    const second = createCharacter('Altvip', 1);\n    const secondRow = db.createCharacter(playerId, second.name, second.vocationId, JSON.stringify(second));\n\n    adminAct(db, adminId, { type: 'grant', characterId: firstId, vipDays: 7 }, NOW);\n\n    const expectedUntil = NOW + 7 * 86_400_000;\n    const firstRow = db.findCharacter(firstId)!;\n    const firstSession = JSON.parse(firstRow.session!) as HuntSession;\n    const secondState = JSON.parse(db.findCharacter(secondRow.id)!.state) as CharacterState;\n    expect(firstSession.character.premium).toBe(true);\n    expect(firstSession.character.vipUntil).toBe(expectedUntil);\n    expect(secondState.premium).toBe(true);\n    expect(secondState.vipUntil).toBe(expectedUntil);\n    expect(Number(db.getWorld(`vip:${playerId}`))).toBe(expectedUntil);\n  });\n\n  it('rejects non-finite or excessive numeric admin mutations', () => {\n    const characterId = createActiveHunter();\n    expect(() => adminAct(db, adminId, { type: 'grant', characterId, gold: Infinity }, NOW)).toThrow('Valor numérico inválido');\n    expect(() => adminAct(db, adminId, { type: 'code', code: 'BAD-NUM', coins: Infinity }, NOW)).toThrow('Valor numérico inválido');\n    expect(() => adminAct(db, adminId, { type: 'mute', accountId: playerId, minutes: 999_999_999 }, NOW)).toThrow('Valor numérico inválido');\n  });'''
          )
          PY
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: Commit validated VIP consistency
        shell: bash
        run: |
          rm .github/workflows/vip-consistency-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: make VIP consistently account-wide'
          git push origin HEAD:main
